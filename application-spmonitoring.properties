# ─── SP Monitoring Batch Job Configuration ───────────────────────────────────
# Job is triggered externally by AutoSys (no Spring-internal scheduling).

# Ensures the job runs automatically when the application starts.
# AutoSys invokes: java -jar sp-monitoring-app.jar
spring.batch.job.enabled=true

# Restrict which job runs on startup (avoids running unrelated jobs).
spring.batch.job.names=spMonitoringSearchIndexJob

# Number of records per chunk commit
sp.monitoring.batch.chunk-size=5000

# JDBC fetch size (should match or be close to chunk-size for optimal throughput)
sp.monitoring.batch.fetch-size=5000
